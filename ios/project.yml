# XcodeGen spec for SkyLink.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open SkyLink.xcodeproj
#
# This exists because wiring two targets, an App Group, entitlements and
# usage strings by hand in Xcode is the single most error-prone part of M0 —
# and because a generated project means the setup is in version control
# instead of in someone's memory.
#
# Set TEAM_ID below (Xcode → Settings → Accounts) before the first device run.
# The simulator works without it.

name: SkyLink
options:
  bundleIdPrefix: com.phoronomics.skylink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""          # <- your 10-character Team ID
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:

  SkyLink:
    type: application
    platform: iOS
    sources:
      - path: SkyLinkKit
      - path: SkyLinkApp
      - path: ../design/auto
        type: folder
        buildPhase: resources
        includes: ["*.png"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.skylink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SkyLink
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: SkyLinkApp/SkyLink.entitlements
    info:
      path: SkyLinkApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.phoronomics.skylink.deeplink
            CFBundleURLSchemes: [skylink]
        # Every string says what is accessed, why, and names the alternative
        # if the user says no. Vague strings get rejected in review and
        # deserve to be.
        NSLocationWhenInUseUsageDescription: >-
          SkyLink uses your location to find the nearest shops and parts
          stores, and to show where you are if you break down. It is only
          used while the app is open — never in the background. You can skip
          it and enter a ZIP code instead.
        NSCameraUsageDescription: >-
          SkyLink uses the camera to scan your VIN so it can show guides and
          parts for your exact engine, and to read your odometer. You can
          always type these in instead.
        NSMicrophoneUsageDescription: >-
          SkyLink uses the microphone so you can ask Auto questions out loud
          with your hands dirty. You can always type instead.
        NSSpeechRecognitionUsageDescription: >-
          SkyLink turns what you say into text so Auto can answer. On
          supported devices this happens on your phone.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: SkyLinkWidgets
        embed: true

  SkyLinkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SkyLinkKit
      - path: SkyLinkWidgets
      - path: ../design/auto
        type: folder
        buildPhase: resources
        includes: ["*.png"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.skylink.widgets
        CODE_SIGN_ENTITLEMENTS: SkyLinkWidgets/SkyLinkWidgets.entitlements
    info:
      path: SkyLinkWidgets/Info.plist
      properties:
        CFBundleDisplayName: SkyLink
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
